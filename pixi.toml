[workspace]
authors = ["alejandrofontan <fontanvillacampa@gmail.com>"]
channels = ["conda-forge"]
name = "VPR-LAB"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.0"

[tasks]
get-vpr-methods-evaluation.cmd = 'git clone --recursive https://github.com/alejandrofontan/VPR-methods-evaluation.git'
#get-vpr-methods-evaluation.cmd = 'git clone --recursive git@github.com:alejandrofontan/VPR-methods-evaluation.git'

vpr-lab.cmd = "python vpr-lab.py --method={{ method }} --database_folder={{ database_folder }} --queries_folder={{ queries_folder }} --log_dir={{ log_dir }} --no_labels"
vpr-lab.cwd = "VPR-methods-evaluation"
vpr-lab.args = [
  { "arg" = "method", "default" = "megaloc" },
  { "arg" = "database_folder", "default" = "/home/alejandro/vpr-test/ASPA135/rgb" },
  { "arg" = "queries_folder", "default" = "/home/alejandro/vpr-test/ASPA135/rgb" },
  { "arg" = "log_dir", "default" = "/home/alejandro/vpr-test/ASPA135/results" },
]

create-gt-matrix.cmd = "python create-gt-matrix.py --gt_file_db={{ gt_file_db }} --gt_file_q={{ gt_file_q }} --rgb_list_db={{ rgb_list_db }} --rgb_list_q={{ rgb_list_q }} --rgb_folder_db={{ rgb_folder_db }} --rgb_folder_q={{ rgb_folder_q }} --gt_matrix={{ gt_matrix }}"
create-gt-matrix.args = [
  { "arg" = "gt_file_db", "default" = "/home/alejandro/vpr-test/ASPA135/groundtruth.txt" },
  { "arg" = "gt_file_q", "default" = "/home/alejandro/vpr-test/ASPA135/groundtruth.txt" },
  { "arg" = "rgb_list_db", "default" = "/home/alejandro/vpr-test/ASPA135/rgb.txt" },
  { "arg" = "rgb_list_q", "default" = "/home/alejandro/vpr-test/ASPA135/rgb.txt" },
  { "arg" = "rgb_folder_db", "default" = "/home/alejandro/vpr-test/ASPA135" },
  { "arg" = "rgb_folder_q", "default" = "/home/alejandro/vpr-test/ASPA135" },  
  { "arg" = "gt_matrix", "default" = "/home/alejandro/vpr-test/ASPA135/results/GT.npy" },  
]

create-mask-matrix.cmd = "python create-mask-matrix.py --gt_file_db={{ gt_file_db }} --gt_file_q={{ gt_file_q }} --rgb_list_db={{ rgb_list_db }} --rgb_list_q={{ rgb_list_q }} --rgb_folder_db={{ rgb_folder_db }} --rgb_folder_q={{ rgb_folder_q }} --gt_matrix={{ gt_matrix }} --mask_matrix={{ mask_matrix }}"
create-mask-matrix.args = [
  { "arg" = "gt_file_db", "default" = "/home/alejandro/vpr-test/ASPA135/groundtruth.txt" },
  { "arg" = "gt_file_q", "default" = "/home/alejandro/vpr-test/ASPA135/groundtruth.txt" },
  { "arg" = "rgb_list_db", "default" = "/home/alejandro/vpr-test/ASPA135/rgb.txt" },
  { "arg" = "rgb_list_q", "default" = "/home/alejandro/vpr-test/ASPA135/rgb.txt" },
  { "arg" = "rgb_folder_db", "default" = "/home/alejandro/vpr-test/ASPA135" },
  { "arg" = "rgb_folder_q", "default" = "/home/alejandro/vpr-test/ASPA135" },  
  { "arg" = "gt_matrix", "default" = "/home/alejandro/vpr-test/ASPA135/results/GT.npy" },  
  { "arg" = "mask_matrix", "default" = "/home/alejandro/vpr-test/ASPA135/results/M.npy" },  
]

demo.cmd = "python demo.py --gt_file_db={{ gt_file_db }} --gt_file_q={{ gt_file_q }} --rgb_list_db={{ rgb_list_db }} --rgb_list_q={{ rgb_list_q }} --rgb_folder_db={{ rgb_folder_db }} --rgb_folder_q={{ rgb_folder_q }} --gt_matrix={{ gt_matrix }} --mask_matrix={{ mask_matrix }} --d_matrix={{ d_matrix }}"
demo.args = [
  { "arg" = "gt_file_db", "default" = "/home/alejandro/vpr-test/ASPA135/groundtruth.txt" },
  { "arg" = "gt_file_q", "default" = "/home/alejandro/vpr-test/ASPA135/groundtruth.txt" },
  { "arg" = "rgb_list_db", "default" = "/home/alejandro/vpr-test/ASPA135/rgb.txt" },
  { "arg" = "rgb_list_q", "default" = "/home/alejandro/vpr-test/ASPA135/rgb.txt" },
  { "arg" = "rgb_folder_db", "default" = "/home/alejandro/vpr-test/ASPA135" },
  { "arg" = "rgb_folder_q", "default" = "/home/alejandro/vpr-test/ASPA135" },  
  { "arg" = "gt_matrix", "default" = "/home/alejandro/vpr-test/ASPA135/results/GT.npy" },  
  { "arg" = "mask_matrix", "default" = "/home/alejandro/vpr-test/ASPA135/results/M.npy" },  
  { "arg" = "d_matrix", "default" = "/home/alejandro/vpr-test/ASPA135/results/D_0_megaloc.npy" },  
]


