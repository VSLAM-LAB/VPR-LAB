[workspace]
authors = ["alejandrofontan <fontanvillacampa@gmail.com>"]
channels = ["conda-forge"]
name = "VPR-LAB"
platforms = ["linux-64"]
version = "0.1.0"

[system-requirements]
cuda = "12.0"

[tasks]
git-clone-vpr-methods-evaluation.cmd = 'git clone --recursive https://github.com/alejandrofontan/VPR-methods-evaluation.git'
git-clone-lightglue.cmd = 'git clone --recursive https://github.com/cvg/LightGlue.git'
install-lightglue = {cmd = 'python -m pip install -e .', cwd = 'LightGlue', depends-on = ['git-clone-lightglue']}
 
vpr-lab.cmd = "python vpr-lab.py --method={{ method }} --database_folder={{ database_folder }} --queries_folder={{ queries_folder }} --log_dir={{ log_dir }} --no_labels"
vpr-lab.cwd = "VPR-methods-evaluation"
vpr-lab.args = [
  { "arg" = "method", "default" = "megaloc" },
  { "arg" = "database_folder", "default" = "/home/alejandro/vpr-test/ASPA135/rgb" },
  { "arg" = "queries_folder", "default" = "/home/alejandro/vpr-test/ASPA135/rgb" },
  { "arg" = "log_dir", "default" = "/home/alejandro/vpr-test/ASPA135/results" },
]

create-gt-matrix.cmd = "python create-gt-matrix.py --exp_yaml={{ exp_yaml }}"
create-gt-matrix.args = [
  { "arg" = "exp_yaml", "default" = "exp_test.yaml" } 
]

create-mask-matrix.cmd = "python create-mask-matrix.py --exp_yaml={{ exp_yaml }}"
create-mask-matrix.args = [
  { "arg" = "exp_yaml", "default" = "exp_test.yaml" } 
]

demo.cmd = "python demo.py --exp_yaml={{ exp_yaml }}"
demo.args = [
  { "arg" = "exp_yaml", "default" = "exp_test.yaml" } 
]

